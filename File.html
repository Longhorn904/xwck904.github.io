<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>星网博客</title>
	<link rel="icon" type="image/png" href="BlogIcon.png">
	<style>
		:root {
			color-scheme: dark;
			--sky: #7fc4ff;
			--orange: #ffad5c;
			--orange-dark: #8f4f20;
			--line: #31506c;
			--panel: #0d1b2b;
			--button: #102238;
			--text: #dfdada;
			--muted: #9eb2c5;
		}

		* {
			box-sizing: border-box;
		}

		html,
		body {
			min-height: 100%;
			margin: 0;
		}

		body {
			background-color: #080e14;
			background-image: linear-gradient(to bottom, #10293d 0 86px, #080e14 86px);
			background-repeat: no-repeat;
			background-size: 100% 100%;
			color: var(--text);
			font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
		}

		.site-header {
			display: flex;
			align-items: center;
			gap: 16px;
			min-height: 86px;
			padding: 8px 16px;
		}

		.site-header img {
			width: 70px;
			height: 70px;
			object-fit: contain;
		}

		.site-header h1 {
			margin: 0;
			color: var(--orange);
			font-size: clamp(22px, 4vw, 32px);
		}

		.site-navigation {
			display: flex;
			flex-wrap: wrap;
			justify-content: center;
			gap: 12px;
			margin-top: 20px;
			margin-bottom: 20px;
		}

		.navigation-button {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			min-height: 42px;
			padding: 8px 18px;
			border: 1px solid var(--line);
			border-radius: 0;
			background-color: var(--button);
			color: var(--text);
			font: inherit;
			font-weight: 600;
			text-decoration: none;
			transition: border-color 160ms ease, background-color 160ms ease;
		}

		.navigation-button:hover,
		.navigation-button:focus-visible {
			border-color: var(--orange);
			background-color: var(--orange-dark);
			color: #ffffff;
		}

		.navigation-button.active {
			border-color: var(--sky);
			background-color: var(--sky);
			color: var(--button);
		}

		.navigation-button:focus-visible {
			outline: 2px solid var(--sky);
			outline-offset: 3px;
		}

		.resource-page {
			width: min(calc(100% - 32px), 760px);
			margin: 0 auto;
			padding: 0 0 48px;
		}

		.resource-panel {
			border: 1px solid var(--line);
			background-color: var(--panel);
		}

		.resource-intro {
			padding: clamp(24px, 5vw, 48px);
			border-bottom: 1px solid var(--line);
			background-color: #102238;
		}

		.resource-intro h2 {
			margin: 0 0 12px;
			color: var(--orange);
			font-size: clamp(24px, 5vw, 38px);
		}

		.resource-intro p,
		.resource-card p {
			line-height: 1.8;
		}

		.resource-intro p {
			max-width: 560px;
			margin: 0;
			color: var(--muted);
		}

		.resource-grid {
			display: grid;
			grid-template-columns: repeat(3, minmax(0, 1fr));
			gap: 12px;
			padding: 24px;
		}

		.resource-card {
			min-width: 0;
			padding: 20px;
			border: 1px solid var(--line);
			background-color: #102238;
		}

		.resource-card h3 {
			margin: 0 0 8px;
			color: var(--orange);
			font-size: 18px;
		}

		.resource-card p {
			margin: 0;
			color: var(--text);
		}

		.resource-card a {
			display: inline-block;
			margin-top: 16px;
			color: var(--sky);
			font-weight: 600;
		}

		.resource-card a:hover,
		.resource-card a:focus-visible {
			color: var(--orange);
		}

		@media (max-width: 600px) {
			.resource-grid {
				grid-template-columns: 1fr;
				padding: 16px;
			}

			.site-header img {
				width: 56px;
				height: 56px;
			}

			.site-header {
				gap: 10px;
				min-height: 72px;
			}
		}
	</style>
</head>
<body>
	<header class="site-header">
		<a href="index.html" aria-label="返回星网博客首页">
			<img src="BlogLogo.png" alt="星网博客 Logo" width="70" height="70">
		</a>
		<h1>星网博客 | 资源</h1>
	</header>

	<nav class="site-navigation" aria-label="主导航">
		<a class="navigation-button" href="index.html"><span>推荐</span></a>
		<a class="navigation-button active" href="File.html"><span>资源</span></a>
		<a class="navigation-button" href="About.html"><span>关于</span></a>
	</nav>

	<main class="resource-page">
		<section class="resource-panel" aria-labelledby="resource-title">
			<div class="resource-intro">
				<h2 id="resource-title">资源中心（暂未开发）</h2>
				<p>整理常用工具、学习资料和项目相关资源，方便快速查找与使用。</p>
			</div>
			<div class="resource-grid">
				<article class="resource-card">
					<h3>星网博客</h3>
					<p>星网博客Github开源仓库</p>
					<a href="https://github.com/Longhorn904/xwck904.github.io/">网站链接</a>
				</article>
				<article class="resource-card">
					<h3>学习资料</h3>
					<p>整理技术学习、开发实践和参考文档。</p>
					<a href="#learning">查看资料</a>
				</article>
				<article class="resource-card">
					<h3>项目资源</h3>
					<p>保存项目中常用的文件、链接和配置内容。</p>
					<a href="#projects">查看项目</a>
				</article>
			</div>
		</section>
	</main>
</body>
</html>
