<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>星网博客</title>
	<link rel="icon" type="image/png" href="BlogIcon.png">
	<style>
		:root {
			color-scheme: dark;
		}

		html,
		body {
			min-height: 100%;
			margin: 0;
		}

		body {
			background-color: #1a2a3a;
			background-image: linear-gradient(to bottom, #10293d 0 86px, #080e14 86px);
			background-repeat: no-repeat;
			background-size: 100% 100%;
			color: #dfdada;
			font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
		}

		main {
			width: 100%;
			text-align: center;
		}

		.site-header {
			box-sizing: border-box;
			display: flex;
			align-items: center;
			gap: 16px;
			width: 100%;
			height: 86px;
			padding: 0 16px;
			text-align: left;
		}

		.site-header img {
			width: 70px;
			height: 70px;
		}

		.site-header h1 {
			margin: 0;
		}

		.site-navigation {
			box-sizing: border-box;
			display: grid;
			grid-template-columns: repeat(3, minmax(0, 1fr));
			gap: 12px;
			width: min(100% - 32px, 960px);
			margin: 0 auto;
			padding: 8px 0 20px;
		}

		.navigation-button {
			box-sizing: border-box;
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 10px;
			min-width: 0;
			min-height: 72px;
			padding: 10px 14px;
			border: 1px solid #31506c;
			border-radius: 6px;
			background-color: #102238;
			color: #dfdada;
			font: inherit;
			font-size: 16px;
			font-weight: 600;
			text-decoration: none;
			transition: border-color 160ms ease, background-color 160ms ease, transform 160ms ease;
		}

		.navigation-button img {
			width: 38px;
			height: 38px;
			flex-shrink: 0;
			object-fit: contain;
		}

		.navigation-button:hover,
		.navigation-button:focus-visible {
			border-color: #7fc4ff;
			background-color: #183c62;
			color: #ffffff;
			transform: translateY(-2px);
		}

		.navigation-button:focus-visible {
			outline: 2px solid #7fc4ff;
			outline-offset: 3px;
		}

		.blog-list {
			display: grid;
			grid-template-columns: repeat(auto-fit, 240px);
			justify-content: center;
			gap: 12px;
			padding: 16px 0 32px;
		}

		.blog-item {
			box-sizing: border-box;
			width: min(240px, 100%);
			height: 300px;
			justify-self: center;
			display: flex;
			flex-direction: column;
			padding: 0;
			border: 1px solid #263b52;
			background-color: #0d1b2b;
			cursor: pointer;
		}

		.blog-item:hover,
		.blog-item:focus-visible {
			border-color: #7fc4ff;
		}

		.blog-item:focus-visible {
			outline: 2px solid #7fc4ff;
			outline-offset: 3px;
		}

		.blog-image-frame {
			width: min(240px, 100%);
			aspect-ratio: 4 / 3;
			height: auto;
			flex-shrink: 0;
			margin: 0 auto;
			overflow: hidden;
			background-color: #142b43;
		}

		.blog-image {
			display: block;
			width: 100%;
			height: 100%;
			object-fit: contain;
		}

		.blog-title {
			box-sizing: border-box;
			width: 100%;
			padding: 12px 16px;
			border-top: 1px solid #263b52;
			color: #dfdada;
			font-size: 14px;
			font-weight: 600;
			text-align: left;
			overflow-wrap: anywhere;
		}

		html.mobile body {
			font-size: 14px;
		}

		@media (max-width: 768px) {
			.site-navigation {
				gap: 6px;
				padding: 4px 0 14px;
			}

			.navigation-button {
				gap: 4px;
				min-height: 48px;
				padding: 6px 4px;
				font-size: 13px;
				white-space: nowrap;
			}

			.navigation-button img {
				width: 28px;
				height: 28px;
			}

			.blog-list {
				grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
			}

			.blog-item {
				width: 100%;
			}
		}
	</style>
</head>
<body>
	<main>
		<header class="site-header">
			<img src="BlogLogo.png" alt="博客图标" width="100" height="100">
			<h1>星网博客</h1>
		</header>
		<nav class="site-navigation" aria-label="主导航">
			<a class="navigation-button" href="">
				<img src="Menu/Blog.png" alt="">
				<span>博客</span>
			</a>
			<a class="navigation-button" href="https://www.baidu.com/">
				<img src="Menu/File.png" alt="">
				<span>资源</span>
			</a>
			<a class="navigation-button" href="https://github.com/">
				<img src="Menu/About.png" alt="">
				<span>关于</span>
			</a>
		</nav>
		<section class="blog-list" aria-label="博客内容">
		</section>
	</main>
	<script>
		function updateDeviceType() {
			const mobileUserAgent = /Android|iPhone|iPad|iPod|Mobile|Windows Phone/i.test(navigator.userAgent);
			const mobileScreen = window.matchMedia("(max-width: 768px)").matches;
			const isMobile = mobileUserAgent || mobileScreen;

			document.documentElement.classList.toggle("mobile", isMobile);
			document.documentElement.dataset.device = isMobile ? "mobile" : "desktop";
			window.isMobile = isMobile;
		}

		updateDeviceType();
		window.addEventListener("resize", updateDeviceType);

		async function loadPosts() {
			const blogList = document.querySelector(".blog-list");
			const githubApiRoot = "https://api.github.com/repos/longhorn904/xwck904.github.io/contents/BP";
			const githubPageRoot = "https://longhorn904.github.io/xwck904.github.io/BP";

			function decodeText(base64Text) {
				const bytes = Uint8Array.from(atob(base64Text.replace(/\n/g, "")), (character) => character.charCodeAt(0));
				return new TextDecoder("utf-8").decode(bytes);
			}

			try {
				const response = await fetch(githubApiRoot);
				if (!response.ok) {
					throw new Error(`读取帖子失败：${response.status}`);
				}
				const folders = await response.json();
				const posts = await Promise.all(folders
					.filter((entry) => entry.type === "dir" && /^\d+$/.test(entry.name))
					.map(async (folder) => {
						const folderResponse = await fetch(folder.url);
						if (!folderResponse.ok) {
							return null;
						}
						const files = await folderResponse.json();
						const htmlFile = files.find((file) => file.name === "BP.html");
						const textFile = files.find((file) => file.name === "text.txt");
						const coverFile = files.find((file) => file.name === "cover.png");
						if (!htmlFile) {
							return null;
						}
						let text = folder.name;
						if (textFile) {
							const textResponse = await fetch(textFile.url);
							if (textResponse.ok) {
								const textData = await textResponse.json();
								text = decodeText(textData.content).trim() || folder.name;
							}
						}
						return {
							folder: folder.name,
							text,
							cover: coverFile?.download_url,
							html: `${githubPageRoot}/${encodeURIComponent(folder.name)}/BP.html`
						};
					}));
				posts.sort((first, second) => Number(second.folder) - Number(first.folder));

				posts.filter(Boolean).forEach((post) => {
					const folderPath = `BP/${post.folder}`;
					const item = document.createElement("article");
					item.className = "blog-item";
					item.tabIndex = 0;
					item.setAttribute("role", "link");

					const imageFrame = document.createElement("div");
					imageFrame.className = "blog-image-frame";
					const image = document.createElement("img");
					image.className = "blog-image";
					image.src = post.cover || "BlogLogo.png";
					image.alt = post.text;
					imageFrame.appendChild(image);

					const text = document.createElement("div");
					text.className = "blog-title";
					text.textContent = post.text;
					item.append(imageFrame, text);

					const postUrl = post.html;
					item.addEventListener("click", () => {
						window.location.href = postUrl;
					});
					item.addEventListener("keydown", (event) => {
						if (event.key === "Enter" || event.key === " ") {
							event.preventDefault();
							window.location.href = postUrl;
						}
					});
					blogList.appendChild(item);
				});
			} catch (error) {
				const message = document.createElement("p");
				message.textContent = "无法读取 GitHub 的 BP 文件夹，请检查仓库地址或网络连接。";
				blogList.appendChild(message);
				console.error(error);
			}
		}

		loadPosts();
	</script>
</body>
</html>
