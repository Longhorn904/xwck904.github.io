<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>星网博客手机版设计稿</title>
	<link rel="icon" type="image/png" href="../../BlogIcon.png">
	<style>
		:root {
			color-scheme: dark;
		}

		* {
			box-sizing: border-box;
		}

		html,
		body {
			min-height: 100%;
			margin: 0;
		}

		body {
			background-color: #080e14;
			background-image: linear-gradient(to bottom, #10293d 0 86px, #080e14 86px);
			background-repeat: no-repeat;
			background-size: 100% 100%;
			color: #dfdada;
			font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
		}

		.site-header {
			display: flex;
			align-items: center;
			gap: 16px;
			width: 100%;
			height: 86px;
			padding: 0 16px;
		}

		.site-header img {
			width: 70px;
			height: 70px;
		}

		.site-header h1 {
			margin: 0;
			font-size: 24px;
		}

		.post {
			width: min(100% - 32px, 900px);
			margin: 0 auto 32px;
			border: 1px solid #263b52;
			background-color: #0d1b2b;
		}

		.post-cover {
			display: block;
			width: 100%;
			max-height: 480px;
			object-fit: contain;
			background-color: #142b43;
		}

		.post-content {
			padding: 24px clamp(16px, 5vw, 48px) 36px;
			text-align: left;
		}

		.post-content h2 {
			margin: 0 0 18px;
			color: #ffffff;
			font-size: clamp(22px, 4vw, 32px);
		}

		.post-text {
			color: #dfdada;
			font-size: 16px;
			line-height: 1.9;
			white-space: pre-wrap;
			word-break: break-word;
		}

		.post-actions {
			display: grid;
			grid-template-columns: repeat(3, minmax(0, 1fr));
			border-top: 1px solid #263b52;
		}

		.post-action {
			display: flex;
			align-items: center;
			justify-content: center;
			min-height: 48px;
			border: 0;
			border-right: 1px solid #263b52;
			background-color: #102238;
			color: #dfdada;
			font: inherit;
			text-decoration: none;
			cursor: pointer;
			transition: background-color 160ms ease, color 160ms ease;
		}

		.post-action:last-child {
			border-right: 0;
		}

		.post-action:hover,
		.post-action:focus-visible {
			background-color: #183c62;
			color: #ffffff;
			outline: 0;
		}

		.post-action:disabled {
			cursor: default;
			opacity: 0.8;
		}

		@media (max-width: 768px) {
			.post {
				width: min(100% - 20px, 900px);
			}

			.post-content {
				padding: 20px 16px 28px;
			}

			.post-action {
				min-height: 44px;
				font-size: 14px;
			}
		}
	</style>
</head>
<body>
	<header class="site-header">
		<img src="../../BlogLogo.png" alt="博客图标" width="70" height="70">
		<h1>星网博客 - 星网博客手机版设计稿</h1>
	</header>

	<main class="post">
		<video class="post-cover" src="v.mp4" controls preload="metadata" aria-label="文章视频"></video>
		<article class="post-content">
			<div class="post-text">
投稿：Longhorn_904
2026/08/28 17:22

大家好啊，这是星网博客第一个视频
			</div>
		</article>
		<div class="post-actions" aria-label="文章操作">
			<button class="post-action" id="like-button" type="button">点赞</button>
			<a class="post-action" href="../../index.html">主页</a>
			<button class="post-action" type="button" id="share-button">分享</button>
		</div>
	</main>
	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
	<script src="../../like-core.js"></script>
	<script>
		initLike({
			button: document.querySelector("#like-button"),
			postId: `post-${window.location.pathname.split("/").filter(Boolean).slice(-2, -1)[0] || "unknown"}`,
			supabaseUrl: "https://avmlbytwypzatvbneotx.supabase.co",
			supabaseKey: "sb_publishable_Av7GoC0UaZSNfY6J66Jb7g_d6TqDppg"
		});

		const shareButton = document.querySelector("#share-button");
		const postTitle = document.title.replace("星网博客 - ", "").trim();

		shareButton.addEventListener("click", async () => {
			const shareText = `【星网博客 - 星网博客手机版设计稿】${window.location.href}`;
			try {
				await navigator.clipboard.writeText(shareText);
				shareButton.textContent = "已复制";
				setTimeout(() => shareButton.textContent = "分享", 1600);
			} catch (error) {
				console.error("复制分享内容失败：", error);
			}
		});
	</script>
</body>
</html>
